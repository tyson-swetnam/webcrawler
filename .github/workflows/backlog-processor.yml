name: Backlog Analyzer

# Chunked analysis of the stored article backlog. Each run skips crawling
# entirely (ANALYZE_ONLY): it hydrates Postgres from the parquet snapshot on
# the website branch (which carries full text for unanalyzed articles),
# analyzes up to CHUNK_SIZE of them via the Claude Max subscription, exports
# the updated snapshot, and publishes. If backlog remains, the run
# re-triggers itself — so a large discovery day (e.g. the 11k-URL first run
# of the sitemap crawler) drains automatically in ~1500-article chunks.

on:
  # Off-peak drains, offset from the 15:00 UTC daily crawl.
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 9 * * *'
    - cron: '0 21 * * *'

  workflow_dispatch:
    inputs:
      remaining_runs:
        description: 'Self-chain budget: how many more times this run may re-trigger itself'
        required: false
        default: '12'

permissions:
  contents: write
  actions: write  # needed to re-trigger itself via workflow_dispatch

# Shared with daily-crawler.yml so runs queue instead of racing each other's
# pushes to the website branch.
concurrency:
  group: website-publish
  cancel-in-progress: false

jobs:
  analyze-backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 100

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ai_news_crawler
          POSTGRES_USER: crawler
          POSTGRES_PASSWORD: github_actions_temp
        options: >-
          --health-cmd "pg_isready -U crawler -d ai_news_crawler"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Install Pagefind and Claude Code CLI
        run: |
          npm install -g pagefind@latest @anthropic-ai/claude-code@2.1.211
          claude --version

      - name: Preflight Claude subscription auth
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is empty. Run 'claude setup-token' and add it as a repository secret."
            exit 1
          fi
          if ! claude -p "Reply with exactly: OK" --model haiku --max-turns 1 > /tmp/claude_probe.txt 2>&1; then
            cat /tmp/claude_probe.txt
            echo "::error::Claude subscription auth probe FAILED — token invalid/expired, or the usage window is exhausted. The next scheduled run will retry."
            exit 1
          fi
          echo "Claude subscription auth verified"

      - name: Seed durable data from website branch
        run: |
          mkdir -p docs/data
          git fetch origin website --depth=1 || true

          fetch_one() {
            local name="$1"
            if git show "origin/website:docs/data/$name" > "docs/data/$name" 2>/dev/null; then
              echo "Seeded docs/data/$name"
            elif git show "origin/website:data/$name" > "docs/data/$name" 2>/dev/null; then
              echo "Seeded docs/data/$name (from root data/)"
            else
              rm -f "docs/data/$name"
              echo "No previous docs/data/$name found"
            fi
          }

          fetch_one articles.parquet
          fetch_one top_news.json
          fetch_one source_health.json

      - name: Analyze backlog chunk
        timeout-minutes: 85
        env:
          DATABASE_URL: postgresql://crawler:github_actions_temp@localhost:5432/ai_news_crawler
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANALYZE_ONLY: true
          ENABLE_AI_ANALYSIS: true
          ENABLE_SLACK_NOTIFICATIONS: false
          ENABLE_EMAIL_NOTIFICATIONS: false
          SAVE_RESULTS_TO_FILE: true
          LOCAL_OUTPUT_DIR: ./output
          LOG_LEVEL: INFO
          DATABASE_POOL_SIZE: 100
          MAX_ARTICLE_AGE_DAYS: 30
          # Chunk size per run; the analyzer batches ~15 articles/message, so
          # 1500 articles ≈ 105 subscription messages ≈ 40 minutes.
          MAX_ARTICLES_PER_RUN: 1500
          MAX_PIPELINE_MINUTES: 70
        run: |
          python -m crawler

      - name: Checkout website branch
        uses: actions/checkout@v4
        with:
          ref: website
          path: website-deploy
          token: ${{ github.token }}

      - name: Copy output to website branch
        run: |
          # GitHub Pages serves the website branch's /docs folder — mirror
          # the generated site there (see daily-crawler.yml for history).
          if [ -d docs ]; then
            mkdir -p website-deploy/docs
            cp -r docs/* website-deploy/docs/
          fi
          if [ -d output ]; then
            mkdir -p website-deploy/output
            cp -r output/* website-deploy/output/ 2>/dev/null || true
          fi

      - name: Commit and push to website branch
        working-directory: ./website-deploy
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Backlog analysis chunk - $(date -u +"%Y-%m-%d %H:%M UTC")"
            for attempt in 1 2 3; do
              if git push origin website; then
                break
              fi
              echo "Push attempt $attempt failed; rebasing and retrying..."
              git pull --rebase origin website
              sleep $((attempt * 5))
              if [ "$attempt" = "3" ]; then
                echo "::error::Failed to push to website branch after 3 attempts"
                exit 1
              fi
            done
          fi

      - name: Re-trigger if backlog remains
        env:
          GH_TOKEN: ${{ github.token }}
          REMAINING_RUNS: ${{ github.event.inputs.remaining_runs || '12' }}
        run: |
          STATS=output/pipeline_stats.json
          if [ ! -f "$STATS" ]; then
            echo "No pipeline stats found; not re-triggering"
            exit 0
          fi
          cat "$STATS"
          PENDING=$(python3 -c "import json;print(json.load(open('$STATS'))['pending_after'])")
          ANALYZED=$(python3 -c "import json;print(json.load(open('$STATS'))['analyzed_total'])")
          QUOTA=$(python3 -c "import json;print(json.load(open('$STATS'))['quota_exhausted'])")

          if [ "$PENDING" -le 0 ]; then
            echo "🎉 Backlog fully drained"
            exit 0
          fi
          if [ "$QUOTA" = "True" ]; then
            echo "Subscription window exhausted; the next scheduled run continues the drain"
            exit 0
          fi
          if [ "$ANALYZED" -le 0 ]; then
            echo "No progress this run; not re-triggering (next schedule will retry)"
            exit 0
          fi
          if [ "$REMAINING_RUNS" -le 0 ]; then
            echo "Self-chain budget exhausted; next scheduled run continues"
            exit 0
          fi

          NEXT=$((REMAINING_RUNS - 1))
          echo "Backlog remaining: $PENDING — re-triggering (chain budget left: $NEXT)"
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/backlog-processor.yml/dispatches" \
            -d "{\"ref\": \"${{ github.ref_name }}\", \"inputs\": {\"remaining_runs\": \"$NEXT\"}}"

      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backlog-run-${{ github.run_id }}
          path: |
            output/pipeline_stats.json
            crawler.log
          retention-days: 7
          if-no-files-found: ignore
