name: Daily AI News Crawler

on:
  # Run daily at 07:00 PST (15:00 UTC)
  schedule:
    - cron: '0 15 * * *'

  # Allow manual triggering
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ai_news_crawler
          POSTGRES_USER: crawler
          POSTGRES_PASSWORD: github_actions_temp
        options: >-
          --health-cmd "pg_isready -U crawler -d ai_news_crawler"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository (main branch for latest code)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Install Pagefind and Claude Code CLI
        run: |
          # Claude Code is pinned so a CLI release can't silently change the
          # headless JSON contract mid-schedule; bump deliberately.
          npm install -g pagefind@latest @anthropic-ai/claude-code@2.1.211
          claude --version

      - name: Preflight Claude subscription auth
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is empty. Run 'claude setup-token' locally (requires a Claude Pro/Max subscription) and add the token as a repository secret named CLAUDE_CODE_OAUTH_TOKEN. Tokens expire after ~1 year."
            exit 1
          fi
          echo "Claude subscription token present"

      - name: Seed durable data from website branch
        run: |
          # The crawler's source of truth (articles.parquet) and the Top News
          # snapshot live on the deployed website branch — pull them into
          # the workspace so the ephemeral Postgres can be hydrated and so
          # the Top News tab survives an empty crawl. The website branch
          # holds these at /data/* (from GH Actions copy) or /docs/data/*
          # (from local systemd commits) — try both. Best-effort: missing
          # files are fine on first run.
          mkdir -p docs/data
          git fetch origin website --depth=1 || true

          fetch_one() {
            local name="$1"
            if git show "origin/website:docs/data/$name" > "docs/data/$name" 2>/dev/null; then
              echo "Seeded docs/data/$name from docs/data/ on website branch"
            elif git show "origin/website:data/$name" > "docs/data/$name" 2>/dev/null; then
              echo "Seeded docs/data/$name from data/ (root) on website branch"
            else
              rm -f "docs/data/$name"
              echo "No previous docs/data/$name found (first run)"
            fi
          }

          fetch_one articles.parquet
          fetch_one top_news.json
          fetch_one source_health.json

      - name: Run crawler
        timeout-minutes: 90
        env:
          DATABASE_URL: postgresql://crawler:github_actions_temp@localhost:5432/ai_news_crawler
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ENABLE_SLACK_NOTIFICATIONS: false
          ENABLE_EMAIL_NOTIFICATIONS: false
          ENABLE_AI_ANALYSIS: true
          SAVE_RESULTS_TO_FILE: true
          LOCAL_OUTPUT_DIR: ./output
          DEBUG: false
          LOG_LEVEL: INFO
          MAX_CONCURRENT_REQUESTS: 24
          CRAWL_DELAY: 0.5
          MAX_ARTICLE_AGE_DAYS: 30
          DATABASE_POOL_SIZE: 100
          USE_RSS_FEEDS: true
        run: |
          python -m crawler
        continue-on-error: false

      - name: Checkout website branch
        uses: actions/checkout@v4
        with:
          ref: website
          path: website-deploy
          token: ${{ github.token }}

      - name: Copy HTML output to website branch
        run: |
          # Copy docs/ (GitHub Pages output) to website deploy root
          if [ -d docs ]; then
            cp -r docs/* website-deploy/
          fi
          # Also copy output/ files if they exist
          if [ -d output ]; then
            cp -r output/* website-deploy/ 2>/dev/null || true
          fi
          # Copy pagefind to docs/ for GitHub Pages (source path: /docs)
          if [ -d docs/pagefind ]; then
            mkdir -p website-deploy/docs
            cp -r docs/pagefind website-deploy/docs/
          fi

          # Create a simple README for the website branch
          cat > website-deploy/README.md << EOF
          # AI University News Aggregator

          Automated daily news aggregator tracking AI research and developments from 380+ universities and research facilities.

          **Live Site:** https://tyson-swetnam.github.io/webcrawler

          **Last Updated:** $(date -u +"%Y-%m-%d %H:%M UTC")

          ## About

          This site automatically crawls university news sites daily and aggregates AI-related research news, with Claude-curated Top News, full-text search, and a DuckDB-WASM analytics dashboard.

          ## Sources

          - Peer Institutions (top R1 universities)
          - R1 Research Universities
          - Major Research Facilities, National Laboratories, and Global Institutions

          ## Technology

          - **Crawler:** Python + Scrapy
          - **AI Analysis:** Claude (via Claude Code CLI, Max subscription)
          - **Deployment:** GitHub Actions + GitHub Pages
          - **Update Schedule:** Daily at 07:00 PST
          EOF

      - name: Commit and push to website branch
        working-directory: ./website-deploy
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add .

          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update AI news aggregator - $(date -u +"%Y-%m-%d %H:%M UTC")

            Automated daily crawler run
            - Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")

            Generated with Claude Code
            Co-Authored-By: GitHub Actions <actions@github.com>"

            # Rebase + retry so we never clobber (or get rejected by) a
            # concurrent push to the website branch.
            for attempt in 1 2 3; do
              if git push origin website; then
                echo "Pushed on attempt $attempt"
                break
              fi
              echo "Push attempt $attempt failed; rebasing and retrying..."
              git pull --rebase origin website
              sleep $((attempt * 5))
              if [ "$attempt" = "3" ]; then
                echo "::error::Failed to push to website branch after 3 attempts"
                exit 1
              fi
            done
          fi

      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-run-${{ github.run_id }}
          path: |
            output/
            crawler.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        run: |
          echo "✅ Crawler completed successfully"
          echo "📊 HTML files generated in output/"
          echo "🌐 Website branch updated"
          echo "🔗 Live at: https://tyson-swetnam.github.io/webcrawler"
